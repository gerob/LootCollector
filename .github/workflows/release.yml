name: Release addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package addon
        run: |
          zip -r LootCollector-${{ github.ref_name }}.zip \
            LootCollector \
            LootCollector_CustomImport \
            LootCollector_StarterDB \
            README.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: LootCollector-${{ github.ref_name }}.zip
          body_path: RELEASE_NOTES.md
